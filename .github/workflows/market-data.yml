name: Crypto radar public market data
on:
  workflow_dispatch:
  push:
    paths:
      - 'market_data.py'
      - 'discovery.py'
      - 'signal_feed.py'
      - 'derivatives.py'
      - 'five_method_audit.py'
      - 'strategy.py'
      - 'enrichment.py'
      - 'healthcheck.py'
      - 'publish_reports.py'
      - 'tests/**'
      - '.github/workflows/market-data.yml'
  schedule:
    - cron: "7,22,37,52 * * * *"
permissions:
  contents: write
concurrency:
  group: crypto-market-data
  cancel-in-progress: false
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Verify OHLCV calculations
        run: python -m unittest discover -s tests -v
      - name: Discover additional liquid spot candidates
        run: python discovery.py
      - name: Collect public spot data
        id: collect
        continue-on-error: true
        run: |
          python market_data.py
          touch /tmp/crypto_radar_fresh_market
      - name: Enrich independent 1h and daily spot data plus fundamental diagnostics
        if: always()
        continue-on-error: true
        run: python enrichment.py
      - name: Collect independent derivatives diagnostics
        if: always()
        continue-on-error: true
        run: python derivatives.py
      - name: Evaluate research-only paper strategy
        if: always()
        run: |
          if test -f /tmp/crypto_radar_fresh_market; then python strategy.py; else echo 'No fresh collection: skip paper evaluation'; fi
      - name: Build deduplicated research feed
        if: always()
        run: |
          if test -f /tmp/crypto_radar_fresh_market; then python signal_feed.py; else echo 'No fresh OHLCV: skip feed'; fi
      - name: Evaluate five strategies conservatively
        if: always()
        run: |
          if test -f /tmp/crypto_radar_fresh_market; then python five_method_audit.py; else echo 'No fresh OHLCV: skip audit'; fi
      - name: Audit report freshness and quality
        if: always()
        run: python healthcheck.py
      - name: Publish validated research reports (conflict-safe)
        if: always()
        run: python publish_reports.py
