name: Crypto radar public market data
on:
  workflow_dispatch:
  push:
    paths:
      - 'market_data.py'
      - 'strategy.py'
      - 'enrichment.py'
      - 'healthcheck.py'
      - 'tests/**'
      - '.github/workflows/market-data.yml'
  schedule:
    - cron: "7,22,37,52 * * * *"
permissions:
  contents: write
concurrency:
  group: crypto-market-data
  cancel-in-progress: false
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Verify OHLCV calculations
        run: python -m unittest discover -s tests -v
      - name: Collect public spot data
        id: collect
        continue-on-error: true
        run: |
          python market_data.py
          touch /tmp/crypto_radar_fresh_market
      - name: Enrich independent 1h and daily spot data plus fundamental diagnostics
        if: always()
        continue-on-error: true
        run: python enrichment.py
      - name: Evaluate research-only paper strategy
        if: always()
        run: |
          if test -f /tmp/crypto_radar_fresh_market; then python strategy.py; else echo 'No fresh collection: skip paper evaluation'; fi
      - name: Audit report freshness and quality
        if: always()
        run: python healthcheck.py
      - name: Publish data report
        if: always()
        run: |
          if test -f docs/latest.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add docs/latest.json
            if test -f docs/enrichment.json; then git add docs/enrichment.json; fi
            if test -f docs/health.json; then git add docs/health.json; fi
            if test -f docs/strategy_status.json; then git add docs/strategy_status.json docs/paper_journal.json; fi
            git diff --staged --quiet || (git commit -m "Refresh public OHLCV diagnostics" && git push)
          fi
