name: Crypto radar public market data
on:
  workflow_dispatch:
  push:
    paths:
      - 'market_data.py'
      - 'bitvavo_probe.py'
      - 'tests/**'
      - '.github/workflows/market-data.yml'
  schedule:
    - cron: "7,22,37,52 * * * *"
permissions:
  contents: write
concurrency:
  group: crypto-market-data
  cancel-in-progress: false
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Verify OHLCV calculations
        run: python -m unittest discover -s tests -v
      - name: Collect public spot data
        run: python market_data.py
      - name: Test Bitvavo public API (diagnostic only)
        if: always()
        run: python bitvavo_probe.py
      - name: Publish data report
        if: always()
        run: |
          if test -f docs/latest.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add docs/latest.json docs/bitvavo_probe.json
            git diff --staged --quiet || (git commit -m "Refresh public OHLCV diagnostics" && git push)
          fi
